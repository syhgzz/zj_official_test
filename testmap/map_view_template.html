<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>小时降水量 · 地图测试视图</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b23; --panel2:#1c222c; --line:#28303c;
    --fg:#e8ecf2; --dim:#8b95a5; --accent:#34e498;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  header{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  header h1{margin:0;font-size:16px;font-weight:650}
  .tag{font-size:12px;color:var(--dim);border:1px solid var(--line);
       border-radius:999px;padding:2px 10px;white-space:nowrap}
  .tag.ok{color:#9df3cd;border-color:rgba(52,228,152,.45)}
  .tag.err{color:#ffb4a2;border-color:rgba(255,120,90,.45)}
  .spacer{flex:1}

  main{flex:1;display:flex;min-height:0}
  #mapWrap{flex:1;position:relative;min-width:0;background:#0b0e13}
  #map{position:absolute;inset:0}
  /* 底图不可用时的离线兜底视图 */
  #fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px}
  #fallback.on{display:flex}
  #fbStage{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;
           background:#0b0e13;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #fbStage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #fbRaster{position:absolute;display:block;pointer-events:none}

  aside{
    width:320px;flex:0 0 320px;border-left:1px solid var(--line);
    background:var(--panel);overflow-y:auto;padding:15px 17px 26px;
  }
  .sec{margin-bottom:20px}
  .sec>h2{margin:0 0 9px;font-size:11.5px;font-weight:600;color:var(--dim);
          letter-spacing:.9px;text-transform:uppercase}
  .rowline{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
  .rowline .k{color:var(--dim);white-space:nowrap}
  .rowline .v{text-align:right;font-variant-numeric:tabular-nums}

  .timebox{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
  .timebox .big{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
  .timebox .date{font-size:12px;color:var(--dim)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;margin:13px 0 5px;
                    background:var(--line);border-radius:3px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:var(--accent);border:2px solid #0b0e13;cursor:pointer;
    box-shadow:0 0 0 3px rgba(52,228,152,.18)}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
         font-variant-numeric:tabular-nums}
  .btnrow{display:flex;gap:7px;margin-top:11px}
  button{flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:7px;padding:6px 9px;font-size:12.5px;cursor:pointer;transition:.15s}
  button:hover{background:#232b36;border-color:#37414f}
  button.on{background:rgba(52,228,152,.14);border-color:rgba(52,228,152,.5);color:#9df3cd}

  .legend{display:flex;flex-direction:column;gap:1px}
  .lg{display:flex;align-items:center;gap:9px;padding:3px 0}
  .sw{width:24px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.22);flex:0 0 auto}
  .sw.tr{background-image:linear-gradient(45deg,#39414e 25%,transparent 25%,transparent 75%,#39414e 75%),
                          linear-gradient(45deg,#39414e 25%,#20262f 25%,#20262f 75%,#39414e 75%);
         background-size:8px 8px;background-position:0 0,4px 4px}
  .lg .rng{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11.5px;min-width:70px}
  .lg .txt{font-size:12.5px}

  .ctl{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--dim)}
  .ctl.on{color:var(--fg)}
  .ctl input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .ctl input[type=range]{flex:1;margin:0}
  .ctl .pc{width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}

  #hint{position:absolute;left:12px;bottom:12px;z-index:5;font-size:12px;color:var(--dim);
        background:rgba(10,13,18,.75);border:1px solid var(--line);border-radius:6px;
        padding:4px 9px;backdrop-filter:blur(4px)}
  footer{padding:8px 18px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;
         background:var(--panel)}
</style>
</head>
<body>

<header>
  <h1 id="title">小时降水量</h1>
  <span class="tag" id="tagLayer">—</span>
  <span class="tag ok" id="tagEngine">—</span>
  <span class="tag" id="tagMap">底图加载中…</span>
  <span class="spacer"></span>
  <span class="tag" id="tagSrc">—</span>
</header>

<main>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="fallback">
      <div id="fbStage">
        <svg id="fbSvg"></svg>
        <img id="fbRaster" alt="降水量">
      </div>
    </div>
    <div id="hint">—</div>
  </div>

  <aside>
    <div class="sec">
      <h2>时刻</h2>
      <div class="timebox">
        <div class="big" id="clock">--:--</div>
        <div class="date" id="dateStr">—</div>
        <input id="slider" type="range" min="0" max="0" value="0" step="1">
        <div class="ticks" id="ticks"></div>
        <div class="btnrow">
          <button id="prev">← 前一帧</button>
          <button id="next">后一帧 →</button>
        </div>
        <div class="btnrow">
          <button id="fit">缩放至图层范围</button>
        </div>
      </div>
    </div>

    <div class="sec">
      <h2>色阶（layer_config.py）</h2>
      <div class="legend" id="legend"></div>
      <label class="ctl" id="whiteWrap">
        <input type="checkbox" id="whiteChk"><span>把 0~0.1 档显示为白色</span>
      </label>
    </div>

    <div class="sec">
      <h2>本帧</h2>
      <div class="rowline"><span class="k">网格</span><span class="v" id="mGrid">—</span></div>
      <div class="rowline"><span class="k">数值范围</span><span class="v" id="mRange">—</span></div>
      <div class="rowline"><span class="k">均值</span><span class="v" id="mMean">—</span></div>
      <div class="rowline"><span class="k">等值面多边形</span><span class="v" id="mPoly">—</span></div>
      <div class="rowline"><span class="k">已填色</span><span class="v" id="mDrawn">—</span></div>
      <div class="rowline"><span class="k">范围 bbox</span><span class="v" id="mBbox">—</span></div>
    </div>

    <div class="sec">
      <h2>显示</h2>
      <label class="ctl on"><input type="checkbox" id="cbBase" checked><span>高德底图</span></label>
      <div class="ctl"><span>底图透明度</span><input type="range" id="baseOp" min="0" max="100" value="100"><span class="pc" id="baseOpV">100%</span></div>
      <label class="ctl on"><input type="checkbox" id="cbOverlay" checked><span>降水覆盖层</span></label>
      <div class="ctl"><span>覆盖层透明度</span><input type="range" id="ovOp" min="0" max="100" value="85"><span class="pc" id="ovOpV">85%</span></div>
    </div>
  </aside>
</main>

<footer>数据：<span id="fSrc">—</span> · <span id="fEngine">—</span> · 底图：高德</footer>

<script src="./wmts_map_config.js"></script>
<script src="./data.js"></script>
<script>
(function () {
  'use strict';
  var XT = window.XT;
  if (!XT) { document.body.innerHTML = '<p style="padding:24px">data.js 没加载到，请先运行 map_test_view.py</p>'; return; }

  var $ = function (id) { return document.getElementById(id); };
  var cur = 0, map = null, AMapNS = null, overlay = null;
  var Z_BASE = 1, Z_OVER = 10;

  function frame() { return XT.frames[cur]; }

  /* ---------------- 底图 ---------------- */
  function fitZoom(bbox) {
    var z = 4;
    for (var i = 4; i <= 17; i++) {
      var scale = Math.pow(2, i);
      var span = (bbox[2] - bbox[0]) / 360 * 256 * scale;
      if (span > window.innerWidth * 0.85) break;
      z = i;
    }
    return z;
  }
  function loadAmap() {
    var cfg = window.WMTS_MAP_CONFIG;
    if (!cfg || !cfg.amap || !cfg.amap.key) return Promise.reject(new Error('缺少高德 Key'));
    window._AMapSecurityConfig = { securityJsCode: cfg.amap.securityJsCode };
    var key = cfg.amap.key;
    return new Promise(function (resolve, reject) {
      var cb = 'initAmap_' + Date.now();
      var s = document.createElement('script');
      var done = false;
      var timer = setTimeout(function () { fin(new Error('高德加载超时（Key 白名单/网络）')); }, 15000);
      function fin(err) {
        if (done) return; done = true; clearTimeout(timer); delete window[cb];
        if (err) reject(err); else if (window.AMap) resolve(window.AMap);
        else reject(new Error('AMap 对象不可用'));
      }
      window[cb] = function () { fin(); };
      s.onload = function () { fin(); };
      s.onerror = function () { fin(new Error('高德脚本加载失败')); };
      s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(key)
            + '&callback=' + encodeURIComponent(cb);
      document.head.appendChild(s);
    });
  }

  /* ---------------- 离线兜底视图 ---------------- */
  function buildFallbackBase() {
    var view = XT.view, VW = view[2] - view[0], VH = view[3] - view[1];
    var latMid = (view[1] + view[3]) / 2;
    var wKm = VW * 111.32 * Math.cos(latMid * Math.PI / 180), hKm = VH * 110.57;
    var wrap = $('mapWrap'), st = $('fbStage');
    var s = Math.min((wrap.clientWidth - 44) / wKm, (wrap.clientHeight - 44) / hKm);
    st.style.width = Math.round(wKm * s) + 'px';
    st.style.height = Math.round(hKm * s) + 'px';

    var NS = 'http://www.w3.org/2000/svg', svg = $('fbSvg');
    svg.setAttribute('viewBox', '0 0 1000 ' + (1000 * VH / VW));
    var H = 1000 * VH / VW;
    svg.innerHTML = '';
    function el(n, a) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); return e; }
    function frange(a, b, st2) { var o = [], v = Math.ceil(a / st2) * st2; for (; v <= b + 1e-9; v += st2) o.push(v); return o; }
    var sx = 1000 / VW, sy = H / VH;
    frange(view[0], view[2], 0.5).forEach(function (lon) {
      var x = (lon - view[0]) * sx;
      svg.appendChild(el('line', { x1: x, y1: 0, x2: x, y2: H, stroke: 'rgba(255,255,255,.14)', 'stroke-width': 1 }));
      var t = el('text', { x: x + 4, y: 13, fill: 'rgba(255,255,255,.45)', 'font-size': 12 });
      t.textContent = lon.toFixed(1) + '°E'; svg.appendChild(t);
    });
    frange(view[1], view[3], 0.5).forEach(function (lat) {
      var y = (view[3] - lat) * sy;
      svg.appendChild(el('line', { x1: 0, y1: y, x2: 1000, y2: y, stroke: 'rgba(255,255,255,.14)', 'stroke-width': 1 }));
      var t = el('text', { x: 5, y: y - 4, fill: 'rgba(255,255,255,.45)', 'font-size': 12 });
      t.textContent = lat.toFixed(1) + '°N'; svg.appendChild(t);
    });
    var d = '';
    (XT.boundary || []).forEach(function (ring) {
      ring.forEach(function (p, i) {
        d += (i ? 'L' : 'M') + ((p[0] - view[0]) * sx).toFixed(1) + ' ' + ((view[3] - p[1]) * sy).toFixed(1);
      });
      d += 'Z';
    });
    if (d) svg.appendChild(el('path', { d: d, fill: 'none', stroke: 'rgba(255,255,255,.8)',
                                       'stroke-width': 2, 'stroke-linejoin': 'round' }));
    setupFallbackImg();
  }
  function setupFallbackImg() {
    var view = XT.view, VW = view[2] - view[0], VH = view[3] - view[1];
    var f = frame(), b = f.bbox, im = $('fbRaster');
    im.src = currentPng(f);
    im.style.left = ((b[0] - view[0]) / VW * 100) + '%';
    im.style.top = ((view[3] - b[3]) / VH * 100) + '%';
    im.style.width = ((b[2] - b[0]) / VW * 100) + '%';
    im.style.height = ((b[3] - b[1]) / VH * 100) + '%';
  }

  /* ---------------- 覆盖层 ---------------- */
  function currentPng(f) {
    var white = $('whiteChk').checked && f.pngWhite;
    return white ? f.pngWhite : f.png;
  }
  function setOverlay() {
    var f = frame();
    if (!map || !AMapNS) { setupFallbackImg(); return; }
    if (overlay) { map.remove(overlay); overlay = null; }
    var b = f.bbox;
    overlay = new AMapNS.ImageLayer({
      url: currentPng(f),
      bounds: new AMapNS.Bounds(new AMapNS.LngLat(b[0], b[1]), new AMapNS.LngLat(b[2], b[3])),
      zooms: [2, 20],
      opacity: Number($('ovOp').value) / 100,
      zIndex: Z_OVER
    });
    map.add(overlay);
    window.__over = overlay;                          // 调试引用
  }
  function fitToLayer() {
    var f = frame(); if (!map || !f) return;
    var b = f.bbox;
    map.setZoomAndCenter(fitZoom(b), [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2], false);
  }

  /* ---------------- 图例 ---------------- */
  function buildLegend() {
    var L = XT.legend, box = $('legend');
    var idx = L.breaks.map(function (_, i) { return i; });
    if (L.order !== 'asc') idx.reverse();
    idx.forEach(function (i) {
      var lo = L.breaks[i], hi = (i < L.breaks.length - 1) ? L.breaks[i + 1] : null;
      var rng = (i === L.breaks.length - 1) ? ('≥ ' + lo) : (lo + ' ~ ' + hi);
      var tr = String(L.colors[i] || '').toUpperCase().slice(-2) === '00';
      var row = document.createElement('div'); row.className = 'lg';
      var sw = document.createElement('span'); sw.className = 'sw' + (tr ? ' tr' : '');
      if (!tr) sw.style.background = L.colors[i];
      var a = document.createElement('span'); a.className = 'rng'; a.textContent = rng;
      var b = document.createElement('span'); b.className = 'txt';
      b.textContent = (L.labels[i] || '').replace(/^\s*[0-9.~≥]+\s*/, '');
      row.appendChild(sw); row.appendChild(a); row.appendChild(b);
      box.appendChild(row);
    });
  }

  /* ---------------- 绘制 ---------------- */
  function draw() {
    var f = frame();
    $('clock').textContent = f.label;
    $('dateStr').textContent = f.time.slice(0, 10) + '（' + XT.unit + '）';
    $('slider').value = cur;
    $('mGrid').textContent = f.cols + ' × ' + f.rows;
    $('mRange').textContent = f.vmin.toFixed(2) + ' ~ ' + f.vmax.toFixed(2) + ' ' + XT.unit;
    $('mMean').textContent = f.vmean.toFixed(3) + ' ' + XT.unit;
    $('mPoly').textContent = f.nPolygons;
    $('mDrawn').textContent = f.nDrawn;
    $('mBbox').textContent = f.bbox.map(function (v) { return v.toFixed(3); }).join(', ');
    $('hint').textContent = XT.title + ' · ' + f.time + ' · ' + f.cols + '×' + f.rows + ' 格网 · '
                          + f.nPolygons + ' 个等值面';
    setOverlay();
  }
  function go(i) { cur = Math.max(0, Math.min(XT.frames.length - 1, i)); draw(); }

  /* ---------------- 启动 ---------------- */
  $('title').textContent = (XT.title || '降水量') + ' · 地图视图';
  $('tagLayer').textContent = XT.layer + ' · ' + XT.title;
  $('tagEngine').textContent = XT.engine;
  $('tagSrc').textContent = XT.source;
  $('fSrc').textContent = XT.source;
  $('fEngine').textContent = XT.note || XT.engine;
  $('slider').max = XT.frames.length - 1;
  $('ticks').innerHTML = XT.frames.map(function (f) { return '<span>' + f.label + '</span>'; }).join('');
  if (!XT.frames.some(function (f) { return !!f.pngWhite; })) $('whiteWrap').style.display = 'none';
  buildLegend();

  $('slider').addEventListener('input', function () { go(+this.value); });
  $('prev').addEventListener('click', function () { go(cur - 1); });
  $('next').addEventListener('click', function () { go(cur + 1); });
  $('fit').addEventListener('click', fitToLayer);
  $('whiteChk').addEventListener('change', function () {
    $('whiteWrap').classList.toggle('on', this.checked); draw();
  });
  $('ovOp').addEventListener('input', function () {
    $('ovOpV').textContent = this.value + '%';
    if (overlay) overlay.setOpacity(Number(this.value) / 100);
  });
  $('baseOp').addEventListener('input', function () {
    $('baseOpV').textContent = this.value + '%';
    applyBase();
  });
  $('cbBase').addEventListener('change', function () {
    applyBase();
    this.parentNode.classList.toggle('on', this.checked);
  });
  $('cbOverlay').addEventListener('change', function () {
    if (overlay) this.checked ? overlay.show() : overlay.hide();
    this.parentNode.classList.toggle('on', this.checked);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(cur - 1);
    if (e.key === 'ArrowRight') go(cur + 1);
  });
  window.addEventListener('resize', function () { if (!map) buildFallbackBase(); });

  /* 底图控制
     ---- 坑：AMap 2.0 里 `new AMap.Map({layers: []})` **并不会**去掉自带的底图，
     map.getLayers() 里仍然有内置的 NebulaLayer 与 LabelsLayer。如果再
     `AMap.createDefaultLayer()` 加一层，地图上就有两份底图，hide() 自己那份
     看起来"没反应"（其实关掉的是后面盖上去的那份，内置那层还在）。
     所以这里不加新层，直接控制地图上已有的、非 ImageLayer 的那些层。 */
  function baseLayersNow() {
    if (!map) return [];
    var ls = [];
    try { ls = map.getLayers() || []; } catch (e) { ls = []; }
    return ls.filter(function (l) {
      return String((l && l.CLASS_NAME) || '').indexOf('ImageLayer') < 0;
    });
  }
  function applyBase() {
    var on = $('cbBase').checked, op = Number($('baseOp').value) / 100;
    baseLayersNow().forEach(function (l) {
      try { if (l.setOpacity) l.setOpacity(op); } catch (e) {}
      try { on ? l.show() : l.hide(); } catch (e) {}
    });
  }

  function showFallback(msg) {
    var t = $('tagMap'); t.textContent = '底图不可用：' + msg; t.className = 'tag err';
    $('map').style.display = 'none';
    $('fallback').classList.add('on');
    buildFallbackBase();
  }
  function showMapOk() {
    var t = $('tagMap'); t.textContent = '高德底图 · 已就绪'; t.className = 'tag ok';
  }

  var f0 = frame();
  loadAmap().then(function (AMap) {
    AMapNS = AMap;
    var b = f0.bbox;
    map = new AMap.Map('map', {
      viewMode: '2D', zoom: fitZoom(b), center: [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2],
      layers: [], resizeEnable: true, showIndoorMap: false
    });
    applyBase();
    // 内置图层可能是异步加上去的，首帧渲染完成后再套一次
    if (map.on) map.on('complete', applyBase);
    window.__map = map;                              // 调试引用
    showMapOk();
    draw();
  }).catch(function (err) {
    console.error(err);
    showFallback(err.message || String(err));
    draw();
  });

  draw();   // 先把数据画上（此时可能还没地图，走兜底）
})();
</script>
</body>
</html>
