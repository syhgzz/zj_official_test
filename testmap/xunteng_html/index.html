<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>小时降水量 · 迅腾参考算法出图</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b23; --panel2:#1c222c; --line:#28303c;
    --fg:#e8ecf2; --dim:#8b95a5; --accent:#34e498;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;
  }

  header{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  header h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
  header .tag{
    font-size:12px;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:2px 10px;
  }
  header .spacer{flex:1}

  main{flex:1;display:flex;min-height:0}

  /* ---------- 舞台 ---------- */
  #stageWrap{
    flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
    padding:22px;background:
      radial-gradient(1200px 600px at 50% 0%,#141922 0%,var(--bg) 70%);
  }
  #stage{position:relative;background:#0b0e13;border:1px solid var(--line);
         border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
  #stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;
             pointer-events:none}
  #raster{position:absolute;display:block;image-rendering:auto;pointer-events:none}
  #tip{
    position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--dim);
    background:rgba(10,13,18,.72);border:1px solid var(--line);border-radius:6px;
    padding:3px 8px;backdrop-filter:blur(4px);
  }

  /* ---------- 侧栏 ---------- */
  aside{
    width:330px;flex:0 0 330px;border-left:1px solid var(--line);
    background:var(--panel);overflow-y:auto;padding:16px 18px 28px;
  }
  .sec{margin-bottom:22px}
  .sec > h2{
    margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim);
    text-transform:uppercase;letter-spacing:.9px;
  }

  .rowline{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13px}
  .rowline .k{color:var(--dim);white-space:nowrap}
  .rowline .v{text-align:right;font-variant-numeric:tabular-nums;word-break:break-all}

  /* 时间轴 */
  .timebox{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px 13px}
  .timebox .big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .timebox .date{font-size:12px;color:var(--dim);margin-top:2px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;margin:14px 0 6px;
    background:var(--line);border-radius:3px;outline:none
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);border:2px solid #0b0e13;cursor:pointer;
    box-shadow:0 0 0 3px rgba(52,228,152,.18)
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--accent);
    border:2px solid #0b0e13;cursor:pointer
  }
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
         font-variant-numeric:tabular-nums}
  .btnrow{display:flex;gap:8px;margin-top:12px}
  button{
    flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
    border-radius:7px;padding:7px 10px;font-size:13px;cursor:pointer;transition:.15s
  }
  button:hover{background:#232b36;border-color:#37414f}
  button.on{background:rgba(52,228,152,.14);border-color:rgba(52,228,152,.5);color:#9df3cd}

  /* 图例 */
  .legend{display:flex;flex-direction:column;gap:2px}
  .lg{display:flex;align-items:center;gap:9px;padding:4px 0}
  .sw{width:26px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.22);flex:0 0 auto}
  .sw.transparent{
    background-image:linear-gradient(45deg,#39414e 25%,transparent 25%,transparent 75%,#39414e 75%),
                     linear-gradient(45deg,#39414e 25%,#20262f 25%,#20262f 75%,#39414e 75%);
    background-size:8px 8px;background-position:0 0,4px 4px
  }
  .lg .rng{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;min-width:74px}
  .lg .txt{font-size:12.5px}

  .chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;
       padding:6px 0;color:var(--dim)}
  .chk input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .chk.on{color:var(--fg)}

  footer{padding:10px 20px;border-top:1px solid var(--line);color:var(--dim);
         font-size:11.5px;background:var(--panel)}
  code{background:#0b0e13;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px}
</style>
</head>
<body>

<header>
  <h1 id="title">小时降水量</h1>
  <span class="tag" id="tagLayer">—</span>
  <span class="tag" id="tagEngine">—</span>
  <span class="spacer"></span>
  <span class="tag" id="tagSrc">—</span>
</header>

<main>
  <div id="stageWrap">
    <div id="stage">
      <!-- 栅格在下，经纬网/轮廓在上：这样开了"0~0.1 白色档"把底图铺满时，
           网格线和行政区轮廓依然看得见（地图惯例） -->
      <img id="raster" alt="小时降水量">
      <svg id="svg" preserveAspectRatio="none"></svg>
      <div id="tip"></div>
    </div>
  </div>

  <aside>
    <div class="sec">
      <h2>时刻</h2>
      <div class="timebox">
        <div class="big" id="clock">--:--</div>
        <div class="date" id="dateStr">—</div>
        <input id="slider" type="range" min="0" max="0" value="0" step="1">
        <div class="ticks" id="ticks"></div>
        <div class="btnrow">
          <button id="prev">← 前一帧</button>
          <button id="next">后一帧 →</button>
        </div>
      </div>
    </div>

    <div class="sec">
      <h2>色阶（layer_config.py）</h2>
      <div class="legend" id="legend"></div>
      <label class="chk" id="whiteChkWrap">
        <input type="checkbox" id="whiteChk">
        <span id="whiteChkText">把 0~0.1 档显示为白色</span>
      </label>
    </div>

    <div class="sec">
      <h2>本帧</h2>
      <div class="rowline"><span class="k">网格</span><span class="v" id="mGrid">—</span></div>
      <div class="rowline"><span class="k">数值范围</span><span class="v" id="mRange">—</span></div>
      <div class="rowline"><span class="k">均值</span><span class="v" id="mMean">—</span></div>
      <div class="rowline"><span class="k">等值面多边形</span><span class="v" id="mPoly">—</span></div>
      <div class="rowline"><span class="k">已填色</span><span class="v" id="mDrawn">—</span></div>
      <div class="rowline"><span class="k">范围 bbox</span><span class="v" id="mBbox">—</span></div>
    </div>

    <div class="sec">
      <h2>显示</h2>
      <label class="chk on"><input type="checkbox" id="cbBound" checked><span>行政区轮廓</span></label>
      <label class="chk"><input type="checkbox" id="cbMask"><span>边界外压暗</span></label>
      <label class="chk on"><input type="checkbox" id="cbGrid" checked><span>经纬网</span></label>
    </div>
  </aside>
</main>

<footer>
  数据：<span id="fSrc">—</span> · 等值面追踪：<span id="fEngine">—</span> ·
  页面零外部依赖，可直接双击打开
</footer>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var XT = window.XT;
  if (!XT) { document.body.innerHTML = '<p style="padding:24px">data.js 没加载到，请先运行 build_xunteng_html.py</p>'; return; }

  var $ = function (id) { return document.getElementById(id); };
  var view = XT.view;
  var VW = view[2] - view[0], VH = view[3] - view[1];

  /* ---------- 舞台尺寸：按 km 保持地理比例（1 格 ≈ 1km，行列近似等比） ---------- */
  function layoutStage() {
    var latMid = (view[1] + view[3]) / 2;
    var wKm = VW * 111.32 * Math.cos(latMid * Math.PI / 180);
    var hKm = VH * 110.57;
    var st = $('stage'), wrap = $('stageWrap');
    var availW = wrap.clientWidth - 44, availH = wrap.clientHeight - 44;
    var s = Math.min(availW / wKm, availH / hKm);
    st.style.width = Math.round(wKm * s) + 'px';
    st.style.height = Math.round(hKm * s) + 'px';
  }

  /* ---------- 经纬度 -> 舞台百分比 ---------- */
  function px(lon) { return (lon - view[0]) / VW * 100; }
  function py(lat) { return (view[3] - lat) / VH * 100; }

  /* ---------- SVG：经纬网 + 行政区轮廓 ---------- */
  var NS = 'http://www.w3.org/2000/svg';

  function buildSvg() {
    var svg = $('svg');
    svg.setAttribute('viewBox', '0 0 1000 ' + (1000 * VH / VW));
    var H = 1000 * VH / VW;
    var sx = 1000 / VW, sy = H / VH;   // 度 -> 视图坐标

    function el(n, attrs) {
      var e = document.createElementNS(NS, n);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }

    var gGrid = el('g', { id: 'gGrid' });
    var gBound = el('g', { id: 'gBound' });
    var gMask = el('g', { id: 'gMask' });

    /* 经纬网：每 0.5° 一条 */
    function frange(a, b, step) {
      var out = [], v = Math.ceil(a / step) * step;
      for (; v <= b + 1e-9; v += step) out.push(Math.round(v * 1000) / 1000);
      return out;
    }
    frange(view[0], view[2], 0.5).forEach(function (lon) {
      var x = (lon - view[0]) * sx;
      gGrid.appendChild(el('line', { x1: x, y1: 0, x2: x, y2: H,
        stroke: 'rgba(255,255,255,.16)', 'stroke-width': 1 }));
      var t = el('text', { x: x + 4, y: 13, fill: 'rgba(255,255,255,.5)', 'font-size': 12 });
      t.textContent = lon.toFixed(1) + '°E';
      gGrid.appendChild(t);
    });
    frange(view[1], view[3], 0.5).forEach(function (lat) {
      var y = (view[3] - lat) * sy;
      gGrid.appendChild(el('line', { x1: 0, y1: y, x2: 1000, y2: y,
        stroke: 'rgba(255,255,255,.16)', 'stroke-width': 1 }));
      var t = el('text', { x: 5, y: y - 4, fill: 'rgba(255,255,255,.5)', 'font-size': 12 });
      t.textContent = lat.toFixed(1) + '°N';
      gGrid.appendChild(t);
    });

    /* 行政区轮廓 */
    var d = '';
    XT.boundary.forEach(function (ring) {
      ring.forEach(function (p, i) {
        var x = (p[0] - view[0]) * sx, y = (view[3] - p[1]) * sy;
        d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      });
      d += 'Z';
    });
    if (d) {
      gBound.appendChild(el('path', { d: d, fill: 'none',
        stroke: 'rgba(255,255,255,.85)', 'stroke-width': 2.2,
        'stroke-linejoin': 'round' }));
      /* 边界外压暗：外框 + 边界环，evenodd 挖洞 */
      var outer = 'M0 0H1000V' + H.toFixed(1) + 'H0Z';
      gMask.appendChild(el('path', { d: outer + d, fill: 'rgba(6,9,13,.62)',
        'fill-rule': 'evenodd' }));
    }

    svg.appendChild(gMask);
    svg.appendChild(gGrid);
    svg.appendChild(gBound);
    window.__g = { grid: gGrid, bound: gBound, mask: gMask };
  }

  /* ---------- 图例 ---------- */
  function buildLegend() {
    var L = XT.legend, box = $('legend');
    var idx = L.breaks.map(function (_, i) { return i; });
    if (L.order !== 'asc') idx.reverse();          // PWV 那种高→低
    idx.forEach(function (i) {
      var lo = L.breaks[i];
      var hi = (i < L.breaks.length - 1) ? L.breaks[i + 1] : null;
      var rng = (i === 0 && lo === 0) ? ('0 ~ ' + hi) : (lo + ' ~ ' + (hi === null ? '∞' : hi));
      if (i === L.breaks.length - 1) rng = '≥ ' + lo;
      var tr = String(L.colors[i] || '').toUpperCase().slice(-2) === '00';
      var row = document.createElement('div');
      row.className = 'lg';
      var sw = document.createElement('span');
      sw.className = 'sw' + (tr ? ' transparent' : '');
      if (!tr) sw.style.background = L.colors[i];
      var a = document.createElement('span'); a.className = 'rng'; a.textContent = rng;
      var b = document.createElement('span'); b.className = 'txt';
      b.textContent = (L.labels[i] || '').replace(/^\s*[0-9.~≥]+\s*/, '') || (L.labels[i] || '');
      row.appendChild(sw); row.appendChild(a); row.appendChild(b);
      row.dataset.transparent = tr ? '1' : '';
      box.appendChild(row);
    });
  }

  /* ---------- 帧 ---------- */
  var cur = 0;

  function frame() { return XT.frames[cur]; }

  function draw() {
    var f = frame();
    var white = $('whiteChk').checked && f.pngWhite;
    var img = $('raster');
    img.src = white ? f.pngWhite : f.png;
    var b = f.bbox;
    img.style.left = px(b[0]) + '%';
    img.style.top = py(b[3]) + '%';
    img.style.width = (px(b[2]) - px(b[0])) + '%';
    img.style.height = (py(b[1]) - py(b[3])) + '%';

    $('clock').textContent = f.label;
    $('dateStr').textContent = f.time.slice(0, 10) + '（' + XT.unit + '）';
    $('slider').value = cur;

    $('mGrid').textContent = f.cols + ' × ' + f.rows;
    $('mRange').textContent = f.vmin.toFixed(2) + ' ~ ' + f.vmax.toFixed(2) + ' ' + XT.unit;
    $('mMean').textContent = f.vmean.toFixed(3) + ' ' + XT.unit;
    $('mPoly').textContent = f.nPolygons;
    $('mDrawn').textContent = f.nDrawn;
    $('mBbox').textContent = f.bbox.map(function (v) { return v.toFixed(3); }).join(', ');
    $('tip').textContent = XT.title + ' · ' + f.time + ' · ' + f.cols + '×' + f.rows + ' 格网';
    $('prev').disabled = $('next').disabled = XT.frames.length < 2;
  }

  function go(i) {
    cur = Math.max(0, Math.min(XT.frames.length - 1, i));
    draw();
  }

  /* ---------- 事件 ---------- */
  function bind() {
    $('slider').max = XT.frames.length - 1;
    $('ticks').innerHTML = XT.frames.map(function (f) { return '<span>' + f.label + '</span>'; }).join('');
    $('slider').addEventListener('input', function () { go(+this.value); });
    $('prev').addEventListener('click', function () { go(cur - 1); });
    $('next').addEventListener('click', function () { go(cur + 1); });
    $('whiteChk').addEventListener('change', function () {
      $('whiteChkWrap').classList.toggle('on', this.checked); draw();
    });
    $('cbBound').addEventListener('change', function () {
      window.__g.bound.style.display = this.checked ? '' : 'none';
      this.parentNode.classList.toggle('on', this.checked);
    });
    $('cbMask').addEventListener('change', function () {
      window.__g.mask.style.display = this.checked ? '' : 'none';
      this.parentNode.classList.toggle('on', this.checked);
    });
    $('cbGrid').addEventListener('change', function () {
      window.__g.grid.style.display = this.checked ? '' : 'none';
      this.parentNode.classList.toggle('on', this.checked);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') go(cur - 1);
      if (e.key === 'ArrowRight') go(cur + 1);
    });
    window.addEventListener('resize', function () { layoutStage(); });
  }

  /* ---------- 初始化 ---------- */
  var hasWhite = XT.frames.some(function (f) { return !!f.pngWhite; });
  if (!hasWhite) { $('whiteChkWrap').style.display = 'none'; }

  // 三个显示开关的初始可见性必须跟复选框状态一致，否则会出现"默认压暗但没勾"
  function syncToggles() {
    [['cbBound', 'bound'], ['cbMask', 'mask'], ['cbGrid', 'grid']].forEach(function (p) {
      var on = $(p[0]).checked;
      window.__g[p[1]].style.display = on ? '' : 'none';
      $(p[0]).parentNode.classList.toggle('on', on);
    });
  }

  $('title').textContent = (XT.title || '降水量') + ' · 8.28';
  $('tagLayer').textContent = XT.layer + ' · ' + XT.title;
  $('tagEngine').textContent = '等值面：' + XT.engine;
  $('tagSrc').textContent = XT.source;
  $('fSrc').textContent = XT.source;
  $('fEngine').textContent = XT.engine;
  $('whiteChkText').textContent = XT.whiteLabel || '把最低档显示为白色';

  layoutStage();
  buildSvg();
  syncToggles();
  buildLegend();
  bind();
  draw();
})();
</script>
</body>
</html>
